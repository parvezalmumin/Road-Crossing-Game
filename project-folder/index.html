<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road Crossing Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="ui">
  <div id="titleContainer" class="center-title">
    <h1 id="gameTitle">ROAD CROSSING GAME</h1>
    <p id="warningText">Cross The Road at your own risk 🚦</p>
  </div>

  <p id="score">Score: 0</p>
  
  <div class="center-ui">
    <p id="message"></p>
    <button id="startBtn">Start Game</button>
    <button id="restartBtn" style="display:none;">Try Again</button>
  </div>
</div>

<canvas id="game"></canvas>

<script src="script.js"></script>
</body>
</html>
